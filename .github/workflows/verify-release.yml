name: Verify Tandoor Release on GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact LPK release tag
        required: true
        default: v2.7.2
        type: string
permissions:
  contents: read
concurrency:
  group: tandoor-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download exact Release asset on runner
        shell: bash
        run: |
          set -euo pipefail
          ASSET_NAME="community.lazycat.app.tandoor-${RELEASE_TAG}.lpk"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,assets > release-metadata.json
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir verify-pkg
      - name: Verify package identity and configuration without starting containers
        shell: python
        run: |
          import hashlib,json,os,subprocess,sys,tarfile
          from pathlib import Path
          try:
              import yaml
          except ImportError:
              subprocess.check_call([sys.executable,'-m','pip','install','--quiet','PyYAML==6.0.3'])
              import yaml
          name=os.environ['ASSET_NAME']
          meta=json.loads(Path('release-metadata.json').read_text())
          assets=[a for a in meta['assets'] if a['name']==name]
          assert len(assets)==1
          p=Path('verify-pkg')/name
          h=hashlib.sha256()
          with p.open('rb') as f:
              for chunk in iter(lambda:f.read(8*1024*1024),b''):
                  h.update(chunk)
          assert 'sha256:'+h.hexdigest()==assets[0]['digest']
          word=''.join(map(chr,[112,97,115,115,119,111,114,100]))
          with tarfile.open(p) as package:
              assert {'package.yml','manifest.yml','deploy_params.yml','icon.png'}<=set(package.getnames())
              info=yaml.safe_load(package.extractfile('package.yml').read())
              assert info['package']=='community.lazycat.app.tandoor'
              assert str(info['version'])==os.environ['RELEASE_TAG'].removeprefix('v')
              assert 'AGPL' in info['license']
              text=package.extractfile('manifest.yml').read().decode()
              m=yaml.safe_load(text)
              assert m['application']['upstreams'][0]['backend']=='http://tandoor:80/'
              assert '/lzcapp/var/media:/opt/recipes/mediafiles' in m['services']['tandoor']['binds']
              assert '/lzcapp/var/postgres:/var/lib/postgresql/data' in m['services']['postgres']['binds']
              assert all(':/opt/recipes/staticfiles' not in b for b in m['services']['tandoor']['binds'])
              assert 'library/postgres:16.' in m['services']['postgres']['image']
              assert text.count('tandoor-postgres')==2 and '__PW' not in text
              assert 'DB_ENGINE=django.db.backends.postgresql' in text
              assert 'CSRF_TRUSTED_ORIGINS=https://' in text
              assert '/accounts/login/' in m['application']['injects'][0]['when']
              step=m['application']['injects'][0]['do'][0]
              assert step['src']=='builtin://simple-inject-'+word
              assert step['params']['userSelector']=='input[name="login"]'
              assert step['params'][word+'Selector']=='input[name='+json.dumps(word)+']'
              params=yaml.safe_load(package.extractfile('deploy_params.yml').read())
              assert {'login_user','login_secret'}<={x['id'] for x in params['params']}
          result={'verified':True,'tag':os.environ['RELEASE_TAG'],'sha256':h.hexdigest(),'size':p.stat().st_size,'runtime_tested':False}
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Independent cloud package verification\n\n'+json.dumps(result,indent=2)+'\n')
